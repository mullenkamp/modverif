site_name: modverif
site_description: Model verification following MET/METplus standards
site_url: https://mullenkamp.github.io/modverif/

repo_url: https://github.com/mullenkamp/modverif
repo_name: mullenkamp/modverif

theme:
    name: material
    icon:
        logo: material/library
    palette:
        # Palette toggle for light mode
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: amber
          accent: cyan
          toggle:
            icon: material/brightness-7
            name: Switch to dark mode

        # Palette toggle for dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: amber
          accent: cyan
          toggle:
            icon: material/brightness-4
            name: Switch to light mode

    features:
        - navigation.sections
        - navigation.expand
        - navigation.top
        - content.code.copy
        - toc.follow

markdown_extensions:
    - toc:
        permalink: true
    - admonition
    - pymdownx.details
    - pymdownx.highlight:
        anchor_linenums: true
    - pymdownx.tasklist:
        custom_checkbox: true
    - pymdownx.inlinehilite
    - pymdownx.snippets:
        base_path: ['.']
        check_paths: true
    - pymdownx.superfences

plugins:
    - search
    - mkdocstrings:
        handlers:
            python:
                inventories:
                    - https://docs.python.org/3.11/objects.inv
                options:
                    docstring_style: numpy
                    show_root_heading: false
                    show_source: false

watch:
    - docs
    - modverif

nav:
    - Home: index.md
    - Getting Started:
        - Installation: getting-started/installation.md
        - Quick Start: getting-started/quickstart.md
    - User Guide:
        - Grid-to-Grid Evaluation: guide/grid-evaluation.md
        - Station Evaluation: guide/station-evaluation.md
        - Cyclone Evaluation: guide/cyclone-evaluation.md
        - Storm Composite Plots: guide/composite-plots.md
        - Verification Plots: guide/verification-plots.md
    - Reference:
        - Metrics: reference/metrics.md
        - Rolling Windows: reference/window.md
        - Spatial Structure: reference/spatial.md
        - Point-to-Grid Matching: reference/match.md
        - Resampling Inference: reference/stats.md
        - Out-of-Sample Assessment: reference/crossval.md
        - API: reference/modverif.md
    - Changelog: changelog.md
    - Development: development.md

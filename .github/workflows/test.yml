# The pipeline. Runs on pushes to `dev` and PRs to `main`.
#
# Two jobs, deliberately separate: a lint failure and a "tests broke on 3.10" failure are different
# problems and should show as different red checks.
#
# History worth knowing (2026-07-31): this repo also carried `build.yml`, a workflow-template
# leftover from repo creation that was disabled in Actions and had never run -- it invoked two hatch
# scripts that did not exist. It was mistaken for the real pipeline, "repaired", and then deleted
# once that was cleared up. If you find yourself adding a second workflow that duplicates this
# matrix, that is the story you are about to repeat.

name: Python testing

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    # Version-bounded on purpose. A floating linter promotes new rules into the selected families on
    # any release and turns this red with no repo change -- the config in pyproject.toml was measured
    # clean at 0.15.0. Keep this in step with the `ruff` bound in [tool.hatch.envs.lint].
    - name: Install ruff
      run: |
        python -m pip install --upgrade pip
        python -m pip install 'ruff~=0.15.0'
    # Scoped at `modverif` so it does not lint conda/, docs/ or a generated site/ tree.
    # Rule selection and the reasoning behind it: [tool.ruff.lint] in pyproject.toml.
    - name: Lint with ruff
      run: |
        ruff check modverif

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        pip install .
    - name: Test with pytest
      run: |
        pytest

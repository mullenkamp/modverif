[project]
name = "modverif"
authors = [
  { name = "mullenkamp", email = "mullenkamp1@gmail.com" }
]
description = ""
readme = "README.md"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">=3.10"
dependencies = [
  # Floor, not a pin: modverif is a library and should not pin its consumers. But it must not be
  # unbounded either -- while `cfdb` was undeclared, CI resolved to PyPI latest (0.9.5) while both
  # consumers hard-pinned 0.8.5, so the suite was green against a version nobody actually ran.
  # 0.9.5 is the floor because 0.9.x changed indexing semantics, int-packed fillvalue handling and
  # calendar-anchored groupby -- a consumer on 0.8.x is not running the code this is tested against.
  'cfdb>=0.9.5',
  'pyproj',
  'h5py',
  'rechunkit>=0.6.0',
  'numpy>2',
  'matplotlib',
  'cartopy',
  'scipy',
]

[build-system]
requires = ["hatchling>=1.26.1"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "spyder-kernels==2.5.2",
  "black",
  "mypy",
  "ruff",
  "pytest",
  "pytest-cov",
]



[tool.hatch]

[tool.hatch.metadata]
allow-direct-references = true

# [tool.hatch.version]
# source = "regex_commit"
# commit_extra_args = ["-e"]
# path = "modverif/__init__.py"

[tool.hatch.envs.default]
python = "3.11"
dependencies = [
    "spyder-kernels==2.5.2",
    "black",
    "mypy",
    "ruff",
    "pytest",
    "pytest-cov",
    "mkdocs-material",
    "mkdocstrings[python]",
    
]

[[tool.hatch.envs.all.matrix]]
python = ['3.10', '3.11', '3.12']

[tool.hatch.envs.lint]
detached = true
dependencies = [
  "black>=23.1.0",
  "mypy>=1.0.0",
  "ruff>=0.0.243",
]
[tool.hatch.envs.lint.scripts]
typing = "mypy --install-types --non-interactive {args:src/modverif tests}"
style = [
  "ruff {args:.}",
  "black --check --diff {args:.}",
]
fmt = [
  "black {args:.}",
  "ruff --fix {args:.}",
  "style",
]
all = [
  "style",
  "typing",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]
docs-serve = "mkdocs serve"
docs-build = "mkdocs build"

[tool.black]
target-version = ["py37"]
line-length = 120
skip-string-normalization = true

[tool.ruff]
target-version = "py311"
line-length = 120
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  # Ignore checks for possible passwords
  "S105", "S106", "S107",
  # Ignore complexity
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
]
unfixable = [
  # Don't touch unused imports
  "F401",
]

[tool.ruff.isort]
known-first-party = ["modverif"]

[tool.ruff.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.coverage.run]
source_pkgs = ["modverif", "tests"]
branch = true
parallel = true
omit = [
  "src/modverif/__about__.py",
]

[tool.coverage.paths]
modverif = ["src/modverif", "*/modverif/src/modverif"]
tests = ["tests", "*/modverif/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[project.urls]
Documentation = "https://mullenkamp.github.io/modverif/"
Source = "https://github.com/mullenkamp/modverif"

[tool.hatch.build.targets.sdist]
include = [
    "/modverif",
]
exclude = [
    "/modverif/tests/*",
]

[tool.hatch.version]
path = "modverif/__init__.py"
